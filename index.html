<!doctype html>
<html lang="de" data-design="8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Rallye-Timer">
<title>Rallye-Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
/* Rallye-Timer Handy: Instrument (Design 8) und Graustufen (Design 10), beide Schwarz-Weiß.
   Layout: oben feste Uhr, darunter Timer-Karten; quer: Anzeige links, Bedienung rechts. */
:root{
  --scale:1;
  --bg:#000;--bg2:#070707;--panel:#0c0c0c;--field:#181818;--line:#383838;
  --fg:#fff;--muted:#9c9c9c;--dim:#5e5e5e;--btn:#1e1e1e;--primary:#fff;--onprimary:#000;
  --ring-bg:#262626;--tick:#6d6d6d;--radius:6px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --num:-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
html[data-design="10"]{
  --bg:#1b1b1b;--bg2:#222;--panel:#2a2a2a;--field:#363636;--line:#444;
  --fg:#f0f0f0;--muted:#a8a8a8;--dim:#6f6f6f;--btn:#3c3c3c;--primary:#ececec;--onprimary:#111;
  --ring-bg:#3a3a3a;--radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px * var(--scale));height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.01em}
[hidden]{display:none!important}

/* Kopf mit Uhr */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + .4rem) max(.75rem,env(safe-area-inset-right,0px)) .45rem max(.75rem,env(safe-area-inset-left,0px))}
.topbar{display:flex;align-items:center;gap:.5rem}
.iconbtn{min-width:3.2rem;height:3.2rem;border-radius:var(--radius);background:var(--btn);font-size:1.35rem;font-weight:800;padding:0 .8rem}
.logo{height:2.9rem;width:auto;display:block}
html[data-design="10"] .logo{display:none}
.clockwrap{flex:1;text-align:center;min-width:0}
.clockrow{text-align:center;margin-top:.15rem}
/* Hochformat: Uhr in eigener Zeile, so groß wie möglich */
@media (orientation:portrait){.clockwrap .clock{display:none}.clockrow .clock{font-size:min(16.5vw,5rem)}
  .topbar .logo{margin-right:auto}.topbar{justify-content:space-between}}
@media (orientation:landscape){.clockrow{display:none}}
.clock{font-size:min(13.5vw,4.4rem);line-height:1}
.clock .ms{font-size:.62em;opacity:.8}
.srcrow{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.35rem auto 0;max-width:26rem}
.srcrow button{height:2.7rem;border-radius:var(--radius);background:var(--btn);font-weight:800;font-size:.95rem}
.srcrow button.on{background:var(--primary);color:var(--onprimary)}
@media (orientation:landscape) and (max-height:520px){.srcrow{max-width:20rem}.srcrow button{height:2.2rem}}
.status{margin-top:.3rem;font-size:.8rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.25;padding:.15rem .4rem;border-radius:4px}
.status.bad{background:var(--primary);color:var(--onprimary)}
.lockbtn{position:relative;overflow:hidden}
.lockbtn::after{content:"";position:absolute;left:0;bottom:0;height:100%;width:var(--hold,0%);background:var(--primary);opacity:.45;pointer-events:none}
html.locked .lockbtn{background:var(--primary);color:var(--onprimary)}
.lockbar{margin-top:.35rem;padding:.45rem .6rem;border-radius:var(--radius);background:var(--primary);color:var(--onprimary);font-weight:800;font-size:.85rem;text-align:center}
html.locked .card button:not(.stop),html.locked .addtimer,html.locked #menuBtn,html.locked #setBtn,html.locked .srcrow button{opacity:.35}
.unlock{margin-top:.4rem;width:100%;height:3rem;border-radius:var(--radius);background:var(--primary);color:var(--onprimary);font-weight:800;font-size:1.05rem}

main{padding:.6rem max(.75rem,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 1.5rem) max(.75rem,env(safe-area-inset-left,0px))}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.2rem 0 .6rem}
.ptitle h2{margin:0;font-size:1.25rem;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Timer-Karte */
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:.8rem;margin-bottom:.9rem}
.chead{display:flex;align-items:center;gap:.5rem}
.tname{flex:1;min-width:0;font-weight:800;font-size:1.2rem;background:var(--field);border:1px solid var(--line);border-radius:4px;
  padding:.55rem .6rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.sbtn{height:3rem;padding:0 .9rem;border-radius:var(--radius);background:var(--btn);font-weight:800;font-size:1rem;white-space:nowrap}
.tstate{font-weight:800;font-size:1rem;margin:.55rem 0 .1rem;color:var(--muted)}
.tstate.on{color:var(--fg)}
.display{display:grid;grid-template-columns:1fr;gap:.4rem;align-items:center}
.lbl{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.elapsed{font-size:min(15vw,3.6rem);line-height:1.05}
.segline{font-weight:700;color:var(--muted);font-size:.95rem}
.info{font-weight:800;font-size:1.05rem;min-height:1.3em}

/* Design 8: Rundinstrument */
.ringbox{position:relative;width:min(78vw,19rem);aspect-ratio:1;margin:.3rem auto}
.ringbox svg{width:100%;height:100%;display:block}
.ringtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:50%;margin:19%}
.ringtext .rt{font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.ringtext .rv{font-size:min(9.5vw,2.4rem);line-height:1.1}
.ringtext .rs{font-size:.78rem;font-weight:700;color:var(--muted)}
.ringtext.inv{background:var(--primary);color:var(--onprimary)}
.ringtext.inv .rt,.ringtext.inv .rs{color:var(--onprimary)}
.rv.warn{color:#d2d2d2}.rv.dim{color:var(--dim)}
html[data-design="10"] .ringbox{display:none}
/* Design 10: große Zahl */
.cdbig{display:none;font-size:min(15.5vw,5rem);line-height:1.05;padding:.1rem .4rem;border-radius:8px;justify-self:start}
html[data-design="10"] .cdbig{display:block}
.cdbig.inv{background:var(--primary);color:var(--onprimary)}
.cdbig.warn{color:#d2d2d2}.cdbig.dim{color:var(--dim)}

.stop{width:100%;height:6.2rem;margin-top:.6rem;border-radius:var(--radius);background:var(--primary);color:var(--onprimary);
  font-size:2.4rem;font-weight:900;letter-spacing:.08em}
html[data-design="8"] .stop{border-radius:999px}
.stop.idle{opacity:.35}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.7rem}
.bigbtn{min-height:3.8rem;border-radius:var(--radius);background:var(--btn);font-weight:800;font-size:1.05rem;padding:.3rem .4rem;line-height:1.15}
.bigbtn.primary{background:var(--primary);color:var(--onprimary)}
.row2{display:grid;grid-template-columns:auto 4.6rem auto 1fr;gap:.5rem;margin-top:.5rem;align-items:center}
.field{min-height:3.8rem;border-radius:var(--radius);background:var(--field);border:2px solid var(--line);font-size:1.45rem;padding:0 .3rem;text-align:center;width:100%}
.unit{font-weight:700;color:var(--muted);font-size:.9rem}
.atrow{display:grid;grid-template-columns:auto 1fr;gap:.5rem;margin-top:.5rem}
.solls{margin-top:.8rem}
.solls .lbl{display:flex;justify-content:space-between;align-items:center}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.6rem,1fr));gap:.45rem;margin-top:.4rem}
.chip{display:flex;align-items:stretch;border-radius:var(--radius);overflow:hidden;border:2px solid var(--line);background:var(--field)}
.chip .cv{flex:1;min-height:3.4rem;font-size:1.3rem;background:transparent;padding:0 .2rem}
.chip .cx{width:2.8rem;background:var(--btn);font-weight:800}
.chip.active{background:var(--primary);border-color:var(--primary)}
.chip.active .cv{color:var(--onprimary)}
.chip.done .cv{color:var(--dim);text-decoration:line-through}
.chip.bad{border-color:var(--fg);border-style:dashed}
.addbtn{min-height:3.4rem;border-radius:var(--radius);background:var(--btn);font-weight:800;font-size:1.05rem}
.addtimer{width:100%;min-height:3.6rem;border-radius:var(--radius);background:var(--btn);font-weight:800;font-size:1.1rem}

/* Querformat: Anzeige links, Bedienung rechts */
@media (orientation:landscape) and (min-width:600px){
  .card{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);column-gap:1rem}
  .chead,.tstate{grid-column:1/3}
  .dispcol{grid-column:1}.ctlcol{grid-column:2}
  .clock{font-size:min(7vw,15vh,4rem)}
  .top{padding-top:calc(env(safe-area-inset-top,0px) + .25rem);padding-bottom:.25rem}
  .status{margin-top:.1rem}
  .display{grid-template-columns:auto 1fr;column-gap:.8rem}
  .display > div:first-child,.segline,.info{grid-column:1/3}
  .elapsed{font-size:min(6.5vw,13vh,3.4rem)}
  .ringbox{width:min(30vw,52vh,15rem);grid-column:1/3}
  .cdbig{font-size:min(8vw,17vh,4.6rem);grid-column:1/3}
  .stop{height:min(5.5rem,22vh)}
  .bigbtn,.field{min-height:min(3.8rem,16vh)}
}

/* Handy quer (wenig Höhe): Countdown und STOPP gleichzeitig sichtbar */
@media (orientation:landscape) and (max-height:520px){
  .ptitle,.tstate{display:none}
  .status{font-size:.7rem}
  .clock{font-size:min(6vw,13vh)}
  main{padding-top:.4rem}
  .card{padding:.5rem .7rem}
  .chead .tname{font-size:1rem;padding:.35rem .5rem}.chead .sbtn{height:2.5rem}
  .display{grid-template-columns:minmax(0,1fr) auto;gap:.1rem .6rem;margin-top:.3rem}
  .display > div:first-child{grid-column:1;grid-row:1}
  .segline{grid-column:1;grid-row:2;font-size:.8rem}
  .cdbig{grid-column:1;grid-row:3;font-size:min(7.5vw,17vh)}
  .info{grid-column:1;grid-row:4;font-size:.9rem;min-height:0}
  .ringbox{grid-column:2;grid-row:1/5;width:min(26vw,44vh);margin:0}
  .ringtext .rv{font-size:min(3.4vw,6.4vh)}.ringtext .rt,.ringtext .rs{font-size:.65rem}
  .elapsed{font-size:min(5vw,10vh)}
  .lbl{font-size:.65rem}
  .stop{height:min(4.6rem,19vh);font-size:1.9rem;margin-top:.4rem}
  .grid3{margin-top:.3rem}.row2,.atrow{margin-top:.4rem}
  .bigbtn,.field{min-height:min(3.4rem,15vh);font-size:.95rem}.field{font-size:1.2rem}
}
/* Seitenleiste Profile */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,22rem);z-index:41;background:var(--bg2);border-right:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + .8rem) .8rem calc(env(safe-area-inset-bottom,0px) + .8rem) max(.8rem,env(safe-area-inset-left,0px));
  overflow-y:auto;display:flex;flex-direction:column;gap:.6rem}
.drawer .dlogo{width:100%;max-width:15rem;margin:0 auto .2rem;display:block}
.dhead{display:flex;justify-content:space-between;align-items:center}
.dhead h3{margin:0;font-size:1.5rem}
.pcard{border:2px solid var(--line);border-radius:var(--radius);padding:.8rem;background:var(--panel)}
.pcard.sel{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.pcard .pn{font-size:1.2rem;font-weight:800;word-break:break-word}
.pcard .pi{font-size:.85rem;font-weight:700;opacity:.8;margin-top:.15rem}
.pcard .pb{display:flex;gap:.5rem;margin-top:.6rem}
.pcard .pb button{height:2.9rem;padding:0 .8rem;border-radius:var(--radius);background:var(--btn);color:var(--fg);font-weight:800}

/* Unteres Blatt (Zahlenfeld, Einstellungen, Rückfragen) */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);border-top:2px solid var(--line);
  border-radius:16px 16px 0 0;padding:.9rem max(.9rem,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + .9rem) max(.9rem,env(safe-area-inset-left,0px));
  max-height:92vh;overflow-y:auto}
.sheet h3{margin:.1rem 0 .5rem;font-size:1.3rem}
.npdisp{font-size:2.6rem;text-align:right;background:var(--field);border-radius:var(--radius);padding:.4rem .8rem;min-height:3.8rem}
.nperr{min-height:1.4rem;font-weight:800;margin:.35rem 0;font-size:.95rem}
.npgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.npgrid button{height:4.1rem;border-radius:var(--radius);background:var(--field);font-size:1.7rem;font-weight:800}
.npgrid button.k2{background:var(--btn)}
.npgrid button.ok{background:var(--primary);color:var(--onprimary)}
.sheetbtns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.6rem}
.sheetbtns button{height:3.4rem;border-radius:var(--radius);background:var(--btn);font-weight:800;font-size:1.05rem}
.sheetbtns button.primary{background:var(--primary);color:var(--onprimary)}
.set{border-top:1px solid var(--line);padding:.8rem 0}
.set:first-of-type{border-top:0}
.set h4{margin:0 0 .25rem;font-size:1.1rem}
.set p{margin:0 0 .55rem;color:var(--muted);font-size:.88rem;line-height:1.35}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.seg2 button,.stepper button,.wide{height:3.2rem;border-radius:var(--radius);background:var(--btn);font-weight:800;font-size:1rem}
.seg2 button.on,.wide.on{background:var(--primary);color:var(--onprimary)}
.stepper{display:grid;grid-template-columns:3.2rem 3.2rem 1fr 3.2rem 3.2rem;gap:.4rem;align-items:center}
.stepper .sv{text-align:center;font-size:1.3rem}
.wide{width:100%;margin-top:.4rem}
.textin{width:100%;font:inherit;font-size:1.3rem;font-weight:700;padding:.8rem;border-radius:var(--radius);border:2px solid var(--line);background:var(--field);color:var(--fg);-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);z-index:60;background:var(--primary);color:var(--onprimary);
  font-weight:800;padding:.7rem 1rem;border-radius:var(--radius);max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(30%);opacity:.4}}}
</style>
</head>

const $ = s => document.querySelector(s);
const pad = (n, w = 2) => String(n).padStart(w, "0");
function fmtClock(t) {               // UTC-ms -> HH:MM:SS.mmm (Ortszeit)
  const d = new Date(t), ms = Math.floor(((t % 1000) + 1000) % 1000);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(ms, 3)}`;
}
function fmtDur(ms, signed = false) {
  const neg = ms < 0; let v = Math.floor(Math.abs(ms) + 1e-6);
  const h = Math.floor(v / 3600000); v -= h * 3600000;
  const m = Math.floor(v / 60000); v -= m * 60000;
  const s = Math.floor(v / 1000), r = v - s * 1000;
  const body = h ? `${h}:${pad(m)}:${pad(s)}.${pad(r, 3)}` : `${pad(m)}:${pad(s)}.${pad(r, 3)}`;
  return (neg ? "−" : signed ? "+" : "") + body;
}

      setText(q("ellbl"), "Laufzeit"); setText(q("elapsed"), "00:00.000"); setText(q("state"), "bereit");
      if (n) { segtxt = `${n} Abschnitt(e) · gesamt ${fmtDur(sg[n - 1].end)}`; rt = `ABSCHNITT 1/${n}`; rv = fmtDur(sg[0].dur); }
    } else if (st === "armed") {
      const rem = t.start - nowD;
      setText(q("ellbl"), "Bis zum Start"); setText(q("elapsed"), fmtDur(nowD - t.start)); setText(q("state"), `Start um ${fmtClock(t.start).slice(0, 8)}`);
      if (rem <= 10000) { [rv, style] = cdView(rem); rt = "START IN"; frac = rem / 10000; segtxt = "Start in …"; }
      else if (n) { rt = `ABSCHNITT 1/${n}`; rv = fmtDur(sg[0].dur); frac = 1; }
      if (n && !segtxt) segtxt = `Abschnitt 1 von ${n} · ${fmtDur(sg[0].dur)}`;
    } else {
      el = (st === "running" ? nowD : t.stop) - t.start;
      setText(q("ellbl"), "Laufzeit"); setText(q("elapsed"), fmtDur(el));
      setText(q("state"), st === "running" ? `● läuft · Start ${fmtClock(t.start).slice(0, 8)}` : `gestoppt ${fmtClock(t.stop).slice(0, 8)}`);
      if (n && st === "running") {
        const k = sg.findIndex(s => s.end - el > -1000);
        if (k < 0) { segtxt = `alle ${n} Abschnitte vorbei`; [rv, style] = cdView(sg[n - 1].end - el); rt = "ÜBER DEM ENDE"; }
        else {
          active = sg[k].i; const rem = sg[k].end - el;
          segtxt = `Abschnitt ${k + 1} von ${n} · ${fmtDur(sg[k].dur)}`; [rv, style] = cdView(rem);
          rt = `ABSCHNITT ${k + 1}/${n}`; frac = Math.max(0, rem / sg[k].dur); rs = "Ende " + fmtClock(t.start + sg[k].end).slice(0, 8);
        }
      } else if (n) {
        let bi = 0; sg.forEach((s, i) => { if (Math.abs(el - s.end) < Math.abs(el - sg[bi].end)) bi = i; });
        const diff = el - sg[bi].end; rv = fmtDur(diff, true); rt = "ABWEICHUNG";
        style = Math.abs(diff) < 500 ? "" : Math.abs(diff) < 2000 ? "warn" : "alert";
        segtxt = `Abweichung zum Ende von Abschnitt ${bi + 1}`;
        info = diff > 0 ? "zu spät (zu langsam gefahren)" : diff < 0 ? "zu früh (zu schnell gefahren)" : "exakt!";
      }
    }
    setCls(q("state"), "on", st === "running" || st === "armed");
    setText(q("seg"), segtxt); setText(q("info"), info);
    const inv = style === "alert" || style === "go";
    // Design 8: Ring
    setText(q("rtt"), rt); setText(q("rv"), rv); setText(q("rs"), rs);
    setCls(q("rt"), "inv", inv); setCls(q("rv"), "warn", style === "warn"); setCls(q("rv"), "dim", style === "dim");
    const arc = c.querySelector(".arc"), off = String((578.05 * (1 - Math.max(0, Math.min(1, frac)))).toFixed(1));
    if (arc.getAttribute("stroke-dashoffset") !== off) arc.setAttribute("stroke-dashoffset", off);
    // Design 10: große Zahl
    const cd = q("cd"); setText(cd, rv); setCls(cd, "inv", inv); setCls(cd, "warn", style === "warn"); setCls(cd, "dim", style === "dim");
    setCls(c.querySelector(".stop"), "idle", st === "idle" || st === "stopped");
    // Sollzeit-Felder
    let doneUpTo = el == null ? -1 : el;
    for (const ch of c.querySelectorAll(".chip")) {
      const i = +ch.dataset.i, s = sg.find(x => x.i === i);
      setCls(ch, "bad", !s && !!t.solls[i]);
      setCls(ch, "active", i === active);
      setCls(ch, "done", st === "running" && !!s && s.end < doneUpTo - 1000);
    }
  }
}

let frameMs = 16.7, lastFrame = 0;
function dispLead() {   // Bildschirm-Verzögerung ausgleichen: ca. 2 Bilder
  return S.dispLead == null ? Math.round(2 * frameMs) : S.dispLead;
}
function loop(ts) {
  if (lastFrame) { frameMs = frameMs * 0.98 + Math.min(50, ts - lastFrame) * 0.02; frameIv.push(ts - lastFrame); if (frameIv.length > 600) frameIv.shift(); }
  lastFrame = ts;
  checkPause();
  const now = Clock.now(), shown = now + dispLead(), s = fmtClock(shown);
  for (const ck of [$("#clock"), $("#clock2")]) if (ck.dataset.v !== s) { ck.dataset.v = s; ck.innerHTML = s.slice(0, 8) + '<span class="ms">' + s.slice(8) + "</span>"; }
  updateTimers(now);
  requestAnimationFrame(loop);
}
let statusTick = 0;
function renderStatus() {
  const el = $("#status"); let txt, bad = false;
  if (S.source === "gps") {
    const g = gpsK();
    if (g == null) { txt = `⚠ GPS: ${G.err || "warte auf GPS-Position …"} – solange gilt die PTB-Zeit`; bad = true; }
    else if (gpsSysStamped()) { txt = "⚠ Dieses Handy liefert dem Browser keine echte GPS-Uhrzeit (nur die Handy-Uhr) – darum gilt weiter die PTB-Zeit"; bad = true; }
    else {
      txt = `● GPS-Zeit (Handy)${G.acc ? ` · Position ±${Math.round(G.acc)} m` : ""}`;
      if (Clock.synced) txt += ` · Unterschied zu PTB ${(g - Clock.K >= 0 ? "+" : "") + Math.round(g - Clock.K)} ms`;
    }
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle("bad", bad); return;
  }
  if (Clock.syncing && !Clock.synced) txt = "Verbinde mit der Atomuhr der PTB …";
  else if (!Clock.synced) { txt = `⚠ Keine Verbindung zur PTB-Atomuhr – zeigt Handy-Uhr (${Clock.error || "warte"})`; bad = true; }
  else {
    const age = Math.round((performance.now() - Clock.last) / 1000), acc = Clock.rtt / 2 + Clock.srvErr;
    if (Clock.error) {
      const drift = acc + age * 0.05;
      txt = `⚠ Kein Netz – Uhr läuft mit letztem PTB-Abgleich weiter (vor ${Math.floor(age / 60)} min, höchstens ±${Math.round(drift)} ms)`; bad = drift > 100;
    } else txt = `● PTB-Atomzeit · Laufzeit ${Math.round(Clock.rtt)} ms herausgerechnet · ±${acc.toFixed(0)} ms · vor ${age < 120 ? age + " s" : Math.floor(age / 60) + " min"}${Clock.syncing ? " · gleiche ab …" : ""}`;
  }
  if (el.textContent !== txt) el.textContent = txt;
  el.classList.toggle("bad", bad);
}

/* ================================================================ Latenz-Messung */
const q2 = (a, f) => { const b = [...a].sort((x, y) => x - y); return b.length ? b[Math.min(b.length - 1, Math.floor(f * b.length))] : NaN; };
async function latencyTest() {
  const sh = sheet(`<h3>Latenz-Messung</h3><div id="latout" style="font-size:.95rem;line-height:1.45;white-space:pre-wrap;font-weight:600">Messe … (ca. 3 Sekunden)</div>
    <div class="sheetbtns"><button data-x="again">Nochmal messen</button><button class="primary" data-x="close">Schließen</button></div>`);
  sh.addEventListener("click", e => { const x = e.target.dataset.x; if (x === "close") closeSheet(); if (x === "again") latencyTest(); });
  const L = [];
  L.push("NETZ ZUR ATOMUHR (PTB)");
  try {
    const smp = (await ptbSamples(16)).sort((a, b) => a.rtt - b.rtt), r = smp.map(x => x.rtt);
    L.push(`  ${smp.length} Messungen · Laufzeit min ${r[0].toFixed(1)} / Median ${q2(r, .5).toFixed(1)} / max ${r[r.length - 1].toFixed(1)} ms`);
    L.push(`  → Genauigkeit ±${(r[0] / 2 + smp[0].e).toFixed(1)} ms (beste Messung zählt, Laufzeit wird herausgerechnet)`);
    const ks = smp.slice(0, 4).map(x => x.K); L.push(`  Streuung der 4 besten Messungen: ${(Math.max(...ks) - Math.min(...ks)).toFixed(1)} ms`);
    L.push(`  Handy-Uhr weicht von der Atomzeit ab um: ${(Date.now() - performance.now() - smp[0].K).toFixed(0)} ms (wird nicht benutzt)`);
  } catch (e) { L.push("  ⚠ PTB nicht erreichbar: " + (e.message || e)); }
  L.push("", "GPS-ZEIT (HANDY)");
  if (S.source !== "gps") L.push("  aus – oben auf „GPS (Handy)“ tippen, um sie mitzumessen");
  else {
    const gr = gpsRaw();
    if (gr == null) L.push("  " + (G.err || "noch keine GPS-Position"));
    else {
      const v = G.samples.map(x => x[1]); const spread = Math.max(...v) - Math.min(...v);
      L.push(`  ${G.samples.length} Positionen in 60 s · Ankunft streut um ${spread.toFixed(0)} ms (früheste zählt)`);
      L.push(`  Zeitstempel: ${gpsSysStamped() ? "⚠ nur Handy-Uhr – keine echte GPS-Zeit" : "GPS"} · Ausgleich ${Math.round(S.gpsCorr || 0)} ms`);
      if (Clock.synced) L.push(`  Unterschied GPS ↔ PTB: ${Math.round(gr + (S.gpsCorr || 0) - Clock.K)} ms`);
    }
  }
  L.push("", "TON");
  if (A.ctx) {
    const ol = A.ctx.outputLatency, bl = A.ctx.baseLatency, ts = A.ctx.getOutputTimestamp && A.ctx.getOutputTimestamp();
    L.push(`  Ausgabe-Latenz des Handys: ${ol ? (ol * 1000).toFixed(1) + " ms" : "nicht gemeldet"} · Basis ${bl ? (bl * 1000).toFixed(1) + " ms" : "–"}`);
    L.push(`  Ausgleich: ${ts && ts.performanceTime > 0 ? "exakt über Ausgabe-Zeitstempel" : "über gemeldete Latenz"} · Töne werden ${LOOKAHEAD * 1000} ms vorher eingeplant`);
    L.push(`  Ton-Vorlauf ${S.audioLead || 0} ms · ausgelassene Töne ${A.skipped} · Tonzustand ${A.ctx.state}`);
    L.push("  Nicht messbar ohne Mikrofon: Verzögerung im Lautsprecher selbst (Bluetooth: 100–300 ms!).");
  } else L.push("  Ton noch nicht aktiviert – einmal auf den Bildschirm tippen.");
  L.push("", "ANZEIGE");
  const fi = frameIv.filter(x => x < 200);
  if (fi.length) L.push(`  Bildtakt Median ${q2(fi, .5).toFixed(1)} ms (${(1000 / q2(fi, .5)).toFixed(0)} Hz) · 95 % unter ${q2(fi, .95).toFixed(1)} ms`);
  L.push(`  Anzeige-Vorlauf ${dispLead()} ms${S.dispLead == null ? " (automatisch)" : ""} gleicht die Bildschirm-Verzögerung aus`);
  L.push("", "BERÜHRUNG");
  L.push(inputDelays.length ? `  Berührung bis Verarbeitung: Median ${q2(inputDelays, .5).toFixed(1)} ms, max ${Math.max(...inputDelays).toFixed(1)} ms – wird herausgerechnet (Zeit der Berührung zählt)` : "  Noch keine Messung – einmal Start oder STOPP antippen.");
  const out = document.getElementById("latout"); if (out) out.textContent = L.join("\n");
}

  const step = () => {
    if (t0 == null) return;
    const f = Math.min(1, (performance.now() - t0) / 1500); btn.style.setProperty("--hold", (f * 100).toFixed(0) + "%");
    if (f >= 1) { S.locked = false; save(); applyLock(); stopHold(); toast("🔓 Entsperrt"); return; }
    raf = requestAnimationFrame(step);
  };
  btn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (!S.locked) { S.locked = true; save(); applyLock(); closeSheet(); toast("🔒 Gesperrt – nur STOPP ist aktiv"); return; }
    t0 = performance.now(); raf = requestAnimationFrame(step);
  });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) btn.addEventListener(ev, stopHold);
  btn.addEventListener("contextmenu", e => e.preventDefault());
})();

/* ================================================================ Bildschirm wach halten */
let wl = null;
async function wakeLock() { try { if (!wl && navigator.wakeLock && document.visibilityState === "visible") { wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => wl = null); } } catch {} }

/* ================================================================ Start */
$("#menuBtn").addEventListener("click", () => { audioUnlock(); if (S.locked) return lockedHint(); drawer(); });
$("#setBtn").addEventListener("click", () => { audioUnlock(); if (S.locked) return lockedHint(); settings(); });
$("#unlockBtn").addEventListener("click", () => audioUnlock());
document.querySelectorAll("[data-src]").forEach(b => b.addEventListener("click", () => { if (S.locked) return lockedHint(); setSource(b.dataset.src); }));
$("#addTimer").addEventListener("click", () => { if (S.locked) return lockedHint(); const p = curProfile(); p.timers.push(defaultTimer(p.timers.length + 1)); save(); renderTimers(); });
for (const evn of ["pointerdown", "pointerup", "click", "touchend"])
  document.addEventListener(evn, () => { audioUnlock(); wakeLock(); }, { capture: true, passive: true });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { checkPause(); requestSync(); wakeLock(); if (A.ctx && A.ctx.state !== "running") A.ctx.resume().catch(() => {}); }
});
window.addEventListener("online", requestSync);
applyLook(); applyLock(); renderTimers(); renderSource(); if (S.source === "gps") gpsStart(); renderStatus();
setInterval(() => {
  renderStatus();
  $("#unlockBtn").hidden = !!(A.ctx && A.ctx.state === "running");
}, 250);
$("#unlockBtn").hidden = false;
requestSync();
requestAnimationFrame(loop);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
